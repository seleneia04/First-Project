    <title>Footer Section</title>
    <style>
        *{box-sizing: border-box;}
        .container-fluid{
          width: 100%; height: 500px;
          background-color: black;

        body{
        padding: 0px; margin: 0px;
        }
        .container{
            width: 80%; margin: auto;
        }
        .row{
            width:  100%;
        }
        .clearfix::after{
            content: "";
            clear: both;
            display: block;
        }
        .col-1{width: 70%;}
        .col-2{width: 30%;}
        .col-2{
            color: white;
        }
        .col{
            float: left;
            color: white;
            padding: 15px 20px;
        }
        .nav-footer{

            padding-left: 0px;
        }
        .nav-footer li{
            display: inline-block;
            width: 120px;
        }
        .nav-footer a{
        
           text-decoration: none;
        }
        .fa-facebook {
          background: #3B5998;
          color: white;
        }

        .fa-twitter {
          background: #1da1f2;
        }

        .fa-youtube {
          background: #ff0000;
         }
         .fa-facebook,
         .fa-twitter,
         .fa-youtube,
         .fa-tiktok {
          color: white;

          border-radius: 150px;
        }
        hr{
            width: 400%;
        }
       .footer-form{
        padding-top: 50px;
       }
       .footer-form .f-label{
            display: block;
       }
       .f-col{
        border: 2px solid white;
        margin-bottom: 20px;
       }
        .col-2{
        display: flex;
        align-items: center;
        
      }
      .f-col{
        padding: 7px 10px;
        width: 230px;
        border: none;
        background-color: inherit;
        color: white;
      }
      .f-col button{
        padding: 7px 10px;
        border: none;
      }
     
    </style>
</head>
